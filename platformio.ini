; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = adafruit_matrixportal_esp32s3
description = LumiFur HUB75 Protogen Controller Software

[env]
; Versions match the locally validated dependency set, including Adafruit transitive libraries.
lib_deps =
	adafruit/Adafruit GFX Library@1.13.0
	adafruit/Adafruit NeoPixel@1.15.5
	adafruit/Adafruit LIS3DH@1.3.0
	adafruit/Adafruit APDS9960 Library@1.3.1
	h2zero/NimBLE-Arduino@2.5.2
	mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@3.1.0
	fastled/FastLED@3.10.8
	adafruit/Adafruit PixelDust@1.1.3
	adafruit/Adafruit BusIO@1.17.4
	adafruit/Adafruit Unified Sensor@1.1.15
extra_scripts =
	pre:tools/platformio/custom_compile.py
	post:tools/platformio/prepare_hub75_driver.py
build_flags = 
	-DFIRMWARE_VERSION=\"5.1.0\"
	-DDEVICE_MODEL=\"mps3\"
	-DAPP_COMPAT_VERSION=\"14.1.0\"
	-DBUILD_DATE=__DATE__
	-DBUILD_TIME=__TIME__
	-DCONFIG_BT_NIMBLE_PINNED_TO_CORE=1
check_flags =
	cppcheck: --inline-suppr --enable=warning,style,performance,portability --suppress=*:*/.pio/libdeps/*
check_skip_packages = yes

[env:dev]
platform = espressif32@6.12.0
board = adafruit_matrixportal_esp32s3
framework = arduino
monitor_speed = 115200
board_build.filesystem = fatfs
extra_scripts =
	${env.extra_scripts}
	pre:tools/platformio/prepare_video_assets.py
build_type = debug
build_flags = 
	${env:adafruit_matrixportal_esp32s3.build_flags}
    -Og
    -g3
monitor_filters = 
	default
	esp32_exception_decoder

[env:esp32]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
lib_deps =
	${env.lib_deps}
	adafruit/Adafruit Protomatter@1.7.0

[env:esp32idf]
framework = 
	arduino
	espidf

[env:adafruit_matrixportal_esp32s3]
platform = espressif32@6.12.0
board = adafruit_matrixportal_esp32s3
framework = arduino
monitor_speed = 115200
board_build.filesystem = fatfs
extra_scripts =
	${env.extra_scripts}
	pre:tools/platformio/prepare_video_assets.py
monitor_dtr = 0
monitor_rts = 0
build_flags = 
	${env.build_flags}
	-O2
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
upload_protocol = esptool
;upload_flags =
;  --before=default_reset
;  --after=hard_reset
monitor_filters = 


[env:adafruit_matrixportal_esp32s3_waveshare] ;MatrixPortal ESP32-S3 with Waveshare Displays
platform = espressif32@6.12.0
board = adafruit_matrixportal_esp32s3
framework = arduino
monitor_speed = 115200
board_build.filesystem = fatfs
extra_scripts =
	${env.extra_scripts}
	pre:tools/platformio/prepare_video_assets.py
monitor_dtr = 0
monitor_rts = 0
build_flags = 
	${env.build_flags}
	-O2
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_ADAFRUIT_MATRIXPORTAL_ESP32S3_Waveshare ;Defines board name for deviceconfig files without requiring a custom PIO environment
upload_protocol = esptool
;upload_flags =
;  --before=default_reset
;  --after=hard_reset
monitor_filters = 


[env:dev-fast]
extends = env:adafruit_matrixportal_esp32s3
build_type = debug
build_unflags =
	-O2
build_flags =
	${env:adafruit_matrixportal_esp32s3.build_flags}
	-Og
	-g3

[env:adafruit_metro_esp32s3]
board = adafruit_metro_esp32s3
platform = espressif32@6.12.0
framework = arduino

[env:codeql]
platform = native@1.2.1
test_framework = googletest
lib_deps = 
	googletest@1.11.0
	adafruit/Adafruit PixelDust@1.1.3
lib_extra_dirs = 
	${env.lib_extra_dirs}
	../common/test_libs
	./test_libs
build_flags = 
	${env.build_flags} -std=gnu++11 -g --coverage -lgcov -ftest-coverage
	-fprofile-arcs
lib_compat_mode = off
debug_test = *

[env:native2]
platform = native@1.2.1
test_framework = unity
lib_compat_mode = off
test_build_src = true
build_src_filter =
	-<*>
	+<core/AnimationState.cpp>
	+<core/ColorParser.cpp>
	+<core/ScrollState.cpp>
	+<core/TemperatureHistory.cpp>
	+<core/video/MonoVideoCodec.cpp>
	+<core/mic/mic_math.cpp>
	+<core/mouth/MouthMorph.cpp>
build_flags = 
	-lgcov
	--coverage
	-DUNITY_CONFIG_DIR=./unity
platform_packages = 
lib_deps =
extra_scripts = tools/platformio/test_coverage.py

[env:native2_windows]
extends = env:native2
build_flags = 
	${env:native2.build_flags}
	-mconsole
